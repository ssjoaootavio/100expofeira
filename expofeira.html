<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Expofeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Cores */
    --navy-900:#0D2144;
    --navy-700:#1F3567;
    --navy-600:#233A6E;
    --gold-400:#D6B370;
    --gold-300:#E4CB98;
    --white:#FFFFFF;
    --ink:#233A6E;
    --muted:#6B7690;
    /* Forma e espaço (base 8px) */
    --radius-card:20px;
    --radius-sheet:40px;
    --radius-pill:999px;
    --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px;
    --font:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* ---------- CAPA ---------- */
  .hero{
    background:linear-gradient(180deg,var(--navy-600) 0%,var(--navy-700) 45%,var(--navy-900) 100%);
    color:var(--white);text-align:center;
    padding:var(--s6) var(--s2) 96px;position:relative;overflow:hidden;
  }
  .hero::before{ /* textura sutil */
    content:"";position:absolute;inset:0;opacity:.06;
    background-image:radial-gradient(var(--white) 1px,transparent 1px);background-size:6px 6px;
  }
  .badge{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:40px;letter-spacing:-2px;position:relative}
  .badge small{font-size:10px;font-weight:700;letter-spacing:.5px;line-height:1.1;text-align:left}
  .title-block{margin-top:var(--s6);position:relative}
  .kicker{font-weight:300;letter-spacing:.32em;font-size:clamp(22px,5vw,40px);padding-left:.32em}
  .title{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin-top:var(--s1)}
  .title svg{width:clamp(56px,11vw,110px);height:auto;flex:none}
  .title h1{font-weight:900;text-transform:uppercase;line-height:.88;text-align:left;font-size:clamp(34px,8.5vw,84px);letter-spacing:-1px}
  .title h1 span{display:block;font-size:.62em;letter-spacing:0}
  .dates{margin-top:var(--s4);font-weight:900;font-size:clamp(28px,6vw,52px);position:relative}
  .sign{position:absolute;left:var(--s3);bottom:56px;text-align:left;font-size:15px;line-height:1.05;letter-spacing:.04em}
  .sign b{display:block;font-weight:800}

  /* ---------- FOLHA BRANCA ---------- */
  .sheet{
    background:var(--white);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    margin-top:-40px;position:relative;padding:var(--s4) var(--s2) var(--s6);
  }
  /* bordas recortadas laterais */
  .sheet::before,.sheet::after{
    content:"";position:absolute;top:120px;bottom:0;width:28px;
    background:
      radial-gradient(circle at 0 50%,var(--navy-600) 13px,transparent 14px) 0 0/28px 56px,
      radial-gradient(circle at 0 50%,transparent 19px,var(--navy-600) 20px,var(--navy-600) 21px,transparent 22px) 0 28px/28px 56px;
    opacity:.9;
  }
  .sheet::before{left:0}
  .sheet::after{right:0;transform:scaleX(-1)}
  .wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}

  .brand-mini{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--navy-600);margin-bottom:var(--s3)}
  .brand-mini svg{width:44px}
  .brand-mini div{font-weight:900;text-transform:uppercase;line-height:.9;font-size:22px}
  .brand-mini div span{display:block;font-size:30px}

  /* abas de dia */
  /* todos os dias visíveis em grade, sem rolagem lateral */
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1);padding:4px 2px var(--s2);position:sticky;top:0;background:var(--white);z-index:5}
  .day{
    min-width:0;border:1.5px solid var(--navy-600);background:var(--white);color:var(--navy-600);
    border-radius:var(--radius-pill);padding:8px 4px;font:700 14px var(--font);cursor:pointer;transition:.15s;
  }
  .day small{font-weight:400;margin-left:4px}
  .day[aria-pressed="true"]{background:var(--navy-600);color:var(--white)}
  .day.today{border-color:var(--gold-400);box-shadow:inset 0 0 0 1.5px var(--gold-400)}
  .day.today small{font-weight:800;letter-spacing:.04em}
  .day:focus-visible,.search:focus-visible{outline:3px solid var(--gold-400);outline-offset:2px}

  .search{width:100%;border:1.5px solid #D5DAE6;border-radius:var(--radius-pill);padding:12px 18px;font:400 15px var(--font);color:var(--ink);margin-bottom:var(--s3)}
  .search::placeholder{color:var(--muted)}

  /* pílula de data */
  .date-pill{
    border:1.5px solid var(--navy-600);border-radius:var(--radius-pill);
    text-align:center;padding:10px var(--s2);margin-bottom:var(--s3);font-size:clamp(15px,3.6vw,20px);text-transform:uppercase
  }
  .date-pill b{font-weight:800}
  .date-pill .sep{margin:0 8px;font-weight:300}

  /* cards */
  .list{display:flex;flex-direction:column;gap:14px;list-style:none}
  .card{
    display:grid;grid-template-columns:76px 1px 1fr;align-items:center;gap:var(--s2);
    border-radius:var(--radius-card);padding:14px var(--s3) 14px var(--s1);min-height:72px;
    background:var(--navy-600);color:var(--white);
  }
  .card:nth-child(even){background:var(--gold-400);color:var(--ink)}
  .card .time{text-align:center;font-weight:800;font-size:17px}
  .card .bar{align-self:stretch;background:currentColor;opacity:.55}
  .card h3{font-weight:700;font-size:15px;line-height:1.25}
  .card .loc{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px;opacity:.9}
  .card .loc svg{width:13px;height:13px;flex:none}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;vertical-align:2px;opacity:.85}
  .empty{text-align:center;color:var(--muted);padding:var(--s6) 0}

  .note,.source{font-size:12px;line-height:1.5;margin-top:8px}
  .source a{color:inherit;overflow-wrap:anywhere}
  .source summary{cursor:pointer}
  .pending-heading h2{font-size:17px;margin-top:16px}
  .visitor-info{margin-bottom:28px}
  .visitor-info>details{border:1px solid #D5DAE6;border-radius:16px;margin-bottom:12px;overflow:hidden}
  .visitor-info>details>summary{padding:16px;background:#fff5e3;font-weight:800;cursor:pointer}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:16px;list-style:none}
  .info-card{padding:16px;border-radius:12px;background:#f4f6fa;min-width:0}
  .info-card h3{font-size:16px;margin-bottom:10px}
  .info-card p{font-size:13px;line-height:1.6;margin-top:6px}
  .info-source{padding:0 16px 16px;font-size:12px;line-height:1.5;color:var(--muted)}

  /* horários de funcionamento do dia */
  .hours{margin-bottom:var(--s3)}
  .hours h2{font:800 13px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--navy-600);margin-bottom:var(--s1)}
  .hours h2 small{font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-left:8px}
  .hours ul{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s1)}
  .hours li{border:1.5px solid #D5DAE6;border-radius:14px;padding:10px 14px}
  .hours li span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.3}
  .hours li b{display:block;font-size:17px;font-weight:800;margin-top:2px}
  .hours li.off b{font-size:14px;font-weight:600;color:var(--muted)}
  footer{border-top:1px solid #E3E7EF;margin-top:var(--s6);padding-top:var(--s3);text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  @media (max-width:520px){
    .day{padding:6px 2px;font-size:13px;border-radius:14px}
    .day small{display:block;margin-left:0}
    .sheet::before,.sheet::after{width:14px;background-size:14px 56px}
    .sheet{padding-left:22px;padding-right:22px}
    .card{grid-template-columns:60px 1px 1fr;gap:12px;padding-right:var(--s2)}
    .card .time{font-size:15px}
    .hours li{padding:10px 12px}
    .hours li b{font-size:15px}
    .sign{display:none}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="badge">100 <small>EXPOFEIRA<br>PELOTAS</small></div>
  <div class="title-block">
    <div class="kicker">AGENDA</div>
    <div class="title">
      <svg viewBox="0 0 100 100" aria-hidden="true" fill="#fff">
        <path d="M86 10C48 12 22 32 20 64c-1 9 2 18 7 24 4-24 18-42 40-54-18 15-30 33-34 56 34-4 54-30 53-80z"/>
        <path d="M14 40c-10 14-8 34 6 46 0-15 5-28 15-38-8 2-15-1-21-8z" opacity=".85"/>
      </svg>
      <h1><span>Programação</span>Expofeira</h1>
    </div>
  </div>
  <div class="dates">05 – 12 OUT.</div>
  <div class="sign">EXPOFEIRA<b>PELOTAS</b></div>
</header>

<main class="sheet">
  <div class="wrap">
    <section id="visitor-info" class="visitor-info" aria-label="Informações para sua visita" hidden></section>
    <nav class="days" aria-label="Dias da programação" id="days"></nav>
    <input class="search" id="q" type="search" placeholder="Buscar evento, raça ou local…" aria-label="Buscar">
    <div class="date-pill" id="pill"></div>
    <section class="hours" id="hours" aria-label="Horários de funcionamento" hidden></section>
    <ul class="list" id="list" aria-live="polite"></ul>
    <footer>Programação sujeita a alterações</footer>
  </div>
</main>

<script>
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const WEEK=['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nav=document.getElementById('days');
const search=document.getElementById('q');
const list=document.getElementById('list');
const pill=document.getElementById('pill');
const hours=document.getElementById('hours');
let agenda, days=[], cur, today;
const todayKey=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:agenda.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const shortTime=t=>t.replace(/^0/,'').replace(':00','h').replace(':','h');
const dateFor=day=>new Date(day+'T12:00:00Z');
const dateLabel=(day,options)=>dateFor(day).toLocaleDateString('pt-BR',{...options,timeZone:'UTC'});

nav.addEventListener('click',e=>{
  const button=e.target.closest('.day');
  if(button){cur=button.dataset.d;render()}
});
search.addEventListener('input',render);
// Se a aba ficou aberta e virou o dia, acompanha a nova data (salvo se a pessoa escolheu outro dia).
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!agenda||!days.length)return;
  const t=todayKey();
  if(t===today)return;
  const follow=cur===today||!days.includes(today);
  today=t;
  if(follow&&days.includes(t))cur=t;
  renderNav();render();
});

function renderNav(){
  nav.innerHTML=days.map(day=>{
    const isToday=day===today;
    return `<button class="day${isToday?' today':''}" type="button" data-d="${day}" aria-pressed="false"${isToday?' aria-current="date"':''}>${dateLabel(day,{day:'2-digit',month:'2-digit'})}<small>${isToday?'HOJE':WEEK[dateFor(day).getUTCDay()].slice(0,3)}</small></button>`;
  }).join('');
}

function render(){
  if(!cur)return;
  nav.querySelectorAll('.day').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===cur));
  pill.textContent=(cur===today?'Hoje, ':'')+dateLabel(cur,{day:'2-digit',month:'long',weekday:'long'});
  renderHours();
  const q=search.value.trim().toLocaleLowerCase('pt-BR');
  const items=agenda.dias[cur]
    .map(row=>Object.fromEntries(agenda.campos.map((field,i)=>[field,row[i]])))
    .filter(e=>!q||[e.titulo,e.local].join(' ').toLocaleLowerCase('pt-BR').includes(q))
    .sort((a,b)=>(a.hora??'99:99').localeCompare(b.hora??'99:99'));
  let pending=false;
  list.innerHTML=items.length?items.map(e=>{
    const category=agenda.tipos[e.tipo];
    const source=agenda.fontes[e.fonte??agenda.fonte_padrao];
    let sourceText=esc(source.descricao);
    if(source.url){
      const url=new URL(source.url);
      if(['https:','http:'].includes(url.protocol)){
        sourceText=`<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${sourceText}</a>`;
      }
    }
    const heading=e.hora===null&&!pending?'<li class="pending-heading"><h2>Horário a confirmar</h2></li>':'';
    if(e.hora===null)pending=true;
    return heading+`
      <li class="card">
        <div class="time">${e.hora===null?'A confirmar':esc(e.hora)}</div><div class="bar"></div>
        <div><h3>${esc(e.titulo)} <span class="tag">${esc(category.name)}</span></h3>
          <div class="loc">${PIN}${esc(e.local??'Local não informado')}</div>
          ${e.observacao?`<p class="note">${esc(e.observacao)}</p>`:''}
          <details class="source"><summary>Fonte</summary><p>${sourceText}</p></details>
        </div>
      </li>`;
  }).join(''):'<li class="empty">Nenhum evento encontrado neste dia.</li>';
}

// Funcionamento do dia selecionado: dias úteis x sábados, domingos e feriados.
function renderHours(){
  const f=agenda.funcionamento;
  if(!f?.areas?.length){hours.hidden=true;return}
  const wd=dateFor(cur).getUTCDay();
  const holiday=(agenda.feriados??[]).includes(cur), weekend=wd===0||wd===6;
  const label=holiday?'Feriado':weekend?'Fim de semana':'Segunda a sexta-feira';
  hours.innerHTML=`<h2>Funcionamento<small>${label}</small></h2><ul>${f.areas.map(([area,wk,we])=>{
    const p=holiday||weekend?we:wk;
    const text=!p?'Sem horário informado':p[1]?`${shortTime(p[0])} às ${shortTime(p[1])}`:`A partir das ${shortTime(p[0])}`;
    return `<li${p?'':' class="off"'}><span>${esc(area)}</span><b>${text}</b></li>`;
  }).join('')}</ul>`;
  hours.hidden=false;
}

function renderVisitorInfo(){
  const section=document.getElementById('visitor-info');
  const source=agenda.fontes[agenda.fonte_informacoes];
  const groups=[['Restaurantes',agenda.restaurantes],['Experiências',agenda.experiencias]];
  section.innerHTML=groups.filter(([,items])=>items?.length).map(([title,items])=>    `<details><summary>${esc(title)}</summary><ul class="info-grid">${items.map(item=>{
      const row=item.data?agenda.dias[item.data]?.find(row=>row[agenda.campos.indexOf('titulo')]===item.titulo_evento):null;
      const event=row?Object.fromEntries(agenda.campos.map((field,i)=>[field,row[i]])):null;
      return `<li class="info-card"><h3>${esc(item.nome)}</h3>
        ${(item.horarios??[]).map(text=>`<p>${esc(text)}</p>`).join('')}
        ${item.data?`<p>${esc(dateLabel(item.data,{day:'2-digit',month:'long',weekday:'long'}))}</p><p><strong>${esc(event?.hora??'Horário a confirmar')}</strong></p><p>${esc(event?.local??'Local não informado')}</p>`:''}
        ${item.observacao?`<p>${esc(item.observacao)}</p>`:''}</li>`;
    }).join('')}</ul>${source?`<p class="info-source">Fonte: ${esc(source.descricao)}</p>`:''}</details>`).join('');
  section.hidden=!section.innerHTML;
}

async function loadAgenda(){
  search.disabled=true;
  list.setAttribute('aria-busy','true');
  list.innerHTML='<li class="empty">Carregando programação…</li>';
  try{
    const response=await fetch('./eventos.json');
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!data.dias||!Array.isArray(data.campos)||!data.tipos||!data.fontes||
       !['hora','titulo','tipo','local','fonte','observacao'].every(field=>data.campos.includes(field))){
      throw new Error('Estrutura da programação inválida');
    }
    days=Object.keys(data.dias).sort();
    for(const day of days){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!Number.isFinite(dateFor(day).getTime())||
         !Array.isArray(data.dias[day]))throw new Error('Data inválida');
      for(const row of data.dias[day]){
        if(!Array.isArray(row))throw new Error('Evento inválido');
        const event=Object.fromEntries(data.campos.map((field,i)=>[field,row[i]]));
        if(typeof event.titulo!=='string'||!event.titulo||
           !(event.hora===null||typeof event.hora==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(event.hora))||
           !(event.local===null||typeof event.local==='string')||
           !Object.hasOwn(data.tipos,event.tipo)||!Object.hasOwn(data.fontes,event.fonte??data.fonte_padrao)){
          throw new Error('Evento inválido');
        }
      }
    }
    agenda=data;
    renderVisitorInfo();
    if(!days.length){
      pill.hidden=true;
      list.innerHTML='<li class="empty">Programação ainda não disponível.</li>';
      return;
    }
    today=todayKey();
    cur=days.includes(today)?today:days[0];
    renderNav();
    render();
    search.disabled=false;
  }catch(error){
    cur=undefined;
    nav.innerHTML='';
    pill.hidden=true;
    list.innerHTML='<li class="empty" role="alert">Não foi possível carregar a programação. Atualize a página para tentar novamente.</li>';
    console.error('Falha ao carregar eventos.json:',error);
  }finally{
    list.setAttribute('aria-busy','false');
  }
}
loadAgenda();
</script>
</body>
</html>
