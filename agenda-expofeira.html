<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Expofeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Cores */
    --navy-900:#0D2144;
    --navy-700:#1F3567;
    --navy-600:#233A6E;
    --gold-400:#D6B370;
    --gold-300:#E4CB98;
    --white:#FFFFFF;
    --ink:#233A6E;
    --muted:#6B7690;
    /* Forma e espaço (base 8px) */
    --radius-card:20px;
    --radius-sheet:40px;
    --radius-pill:999px;
    --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px;
    --font:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* ---------- CAPA ---------- */
  .hero{
    background:linear-gradient(180deg,var(--navy-600) 0%,var(--navy-700) 45%,var(--navy-900) 100%);
    color:var(--white);text-align:center;
    padding:var(--s6) var(--s2) 96px;position:relative;overflow:hidden;
  }
  .hero::before{ /* textura sutil */
    content:"";position:absolute;inset:0;opacity:.06;
    background-image:radial-gradient(var(--white) 1px,transparent 1px);background-size:6px 6px;
  }
  .badge{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:40px;letter-spacing:-2px;position:relative}
  .badge small{font-size:10px;font-weight:700;letter-spacing:.5px;line-height:1.1;text-align:left}
  .title-block{margin-top:var(--s6);position:relative}
  .kicker{font-weight:300;letter-spacing:.32em;font-size:clamp(22px,5vw,40px);padding-left:.32em}
  .title{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin-top:var(--s1)}
  .title svg{width:clamp(56px,11vw,110px);height:auto;flex:none}
  .title h1{font-weight:900;text-transform:uppercase;line-height:.88;text-align:left;font-size:clamp(34px,8.5vw,84px);letter-spacing:-1px}
  .title h1 span{display:block;font-size:.62em;letter-spacing:0}
  .dates{margin-top:var(--s4);font-weight:900;font-size:clamp(28px,6vw,52px);position:relative}
  .sign{position:absolute;left:var(--s3);bottom:56px;text-align:left;font-size:15px;line-height:1.05;letter-spacing:.04em}
  .sign b{display:block;font-weight:800}

  /* ---------- FOLHA BRANCA ---------- */
  .sheet{
    background:var(--white);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    margin-top:-40px;position:relative;padding:var(--s4) var(--s2) var(--s6);
  }
  /* bordas recortadas laterais */
  .sheet::before,.sheet::after{
    content:"";position:absolute;top:120px;bottom:0;width:28px;
    background:
      radial-gradient(circle at 0 50%,var(--navy-600) 13px,transparent 14px) 0 0/28px 56px,
      radial-gradient(circle at 0 50%,transparent 19px,var(--navy-600) 20px,var(--navy-600) 21px,transparent 22px) 0 28px/28px 56px;
    opacity:.9;
  }
  .sheet::before{left:0}
  .sheet::after{right:0;transform:scaleX(-1)}
  .wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}

  .brand-mini{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--navy-600);margin-bottom:var(--s3)}
  .brand-mini svg{width:44px}
  .brand-mini div{font-weight:900;text-transform:uppercase;line-height:.9;font-size:22px}
  .brand-mini div span{display:block;font-size:30px}

  /* abas de dia */
  .days{display:flex;gap:var(--s1);overflow-x:auto;padding:4px 2px var(--s2);scrollbar-width:none;position:sticky;top:0;background:var(--white);z-index:5}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:none;border:1.5px solid var(--navy-600);background:var(--white);color:var(--navy-600);
    border-radius:var(--radius-pill);padding:8px 16px;font:700 14px var(--font);cursor:pointer;transition:.15s;
  }
  .day small{font-weight:400;margin-left:4px}
  .day[aria-selected="true"]{background:var(--navy-600);color:var(--white)}
  .day:focus-visible,.search:focus-visible{outline:3px solid var(--gold-400);outline-offset:2px}

  .search{width:100%;border:1.5px solid #D5DAE6;border-radius:var(--radius-pill);padding:12px 18px;font:400 15px var(--font);color:var(--ink);margin-bottom:var(--s3)}
  .search::placeholder{color:var(--muted)}

  /* pílula de data */
  .date-pill{
    border:1.5px solid var(--navy-600);border-radius:var(--radius-pill);
    text-align:center;padding:10px var(--s2);margin-bottom:var(--s3);font-size:clamp(15px,3.6vw,20px);text-transform:uppercase
  }
  .date-pill b{font-weight:800}
  .date-pill .sep{margin:0 8px;font-weight:300}

  /* cards */
  .list{display:flex;flex-direction:column;gap:14px;list-style:none}
  .card{
    display:grid;grid-template-columns:76px 1px 1fr;align-items:center;gap:var(--s2);
    border-radius:var(--radius-card);padding:14px var(--s3) 14px var(--s1);min-height:72px;
    background:var(--navy-600);color:var(--white);
  }
  .card:nth-child(even){background:var(--gold-400);color:var(--ink)}
  .card .time{text-align:center;font-weight:800;font-size:17px}
  .card .bar{align-self:stretch;background:currentColor;opacity:.55}
  .card h3{font-weight:700;font-size:15px;line-height:1.25}
  .card .loc{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px;opacity:.9}
  .card .loc svg{width:13px;height:13px;flex:none}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:var(--radius-pill);padding:1px 7px;margin-left:6px;vertical-align:2px;opacity:.85}
  .empty{text-align:center;color:var(--muted);padding:var(--s6) 0}

  footer{border-top:1px solid #E3E7EF;margin-top:var(--s6);padding-top:var(--s3);text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  @media (max-width:520px){
    .sheet::before,.sheet::after{width:14px;background-size:14px 56px}
    .sheet{padding-left:22px;padding-right:22px}
    .card{grid-template-columns:60px 1px 1fr;gap:12px;padding-right:var(--s2)}
    .card .time{font-size:15px}
    .sign{display:none}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="badge">100 <small>EXPOFEIRA<br>PELOTAS</small></div>
  <div class="title-block">
    <div class="kicker">AGENDA</div>
    <div class="title">
      <svg viewBox="0 0 100 100" aria-hidden="true" fill="#fff">
        <path d="M86 10C48 12 22 32 20 64c-1 9 2 18 7 24 4-24 18-42 40-54-18 15-30 33-34 56 34-4 54-30 53-80z"/>
        <path d="M14 40c-10 14-8 34 6 46 0-15 5-28 15-38-8 2-15-1-21-8z" opacity=".85"/>
      </svg>
      <h1><span>Programação</span>Expofeira</h1>
    </div>
  </div>
  <div class="dates">05 – 12 OUT.</div>
  <div class="sign">EXPOFEIRA<b>PELOTAS</b></div>
</header>

<main class="sheet">
  <div class="wrap">
    <nav class="days" role="tablist" id="days"></nav>
    <input class="search" id="q" type="search" placeholder="Buscar evento, raça ou local…" aria-label="Buscar">
    <div class="date-pill" id="pill"></div>
    <ul class="list" id="list"></ul>
    <footer>Programação sujeita a alterações</footer>
  </div>
</main>

<script>
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const WEEK=['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
const CONF=['Arena da Conferência','AEAPEL','Casa da Amizade','Vetesul'];

const DATA={
 5:[["8h","XXV Simpósio de Ovinocultura da Região Sul","Arena da Conferência"],["8h","Julgamento de Admissão da raça Brangus - Piratinizinho","Centro de Manejo"],["9h","Reunião Ordinária do Comitê de Gerenciamento das Bacias Hidrográficas Mirim e São Gonçalo","AEAPEL"],["10h","Julgamento de Admissão da Raça Angus - Nacional","Centro de Manejo"],["11h30","Abertura restaurante Choperia Cruz de Malta","Em frente à Pista B"],["13h30","Ciranda Cultural Embrapa","Pavilhão Jorge Gertum"],["14h","Mostra UFPel","Pavilhão Jorge Gertum"],["14h","Reunião COPAM","AEAPEL"],["14h","Admissão da Raça Charolês","Centro de Manejo"],["14h","XXV Simpósio de Ovinocultura da Região Sul","Arena da Conferência"],["14h","Oficina de Sensibilização, Criação Poética e Inspiração Criativa","Casa da Amizade"],["16h","Agro, Comunica, Alimenta e Educa","Casa da Amizade"],["18h","Equoterapia Apae - Xiru Antunes e Silvério Barcellos","Palco Tropa Entregue"],["18h","Arte na Rural","Salão Nobre"],["19h","Leilão Brangus Piratini","Pavilhão Álvaro Azevedo"]],
 6:[["8h","Julgamento de Admissão raça composta Montana","Casa da Amizade"],["8h","Seminário de Bovinos de Corte","Arena da Conferência"],["8h","XVII Seminário de Turismo Rural","AEAPEL"],["8h","V Seminário de Inspeção e Responsabilidade Técnica em Produtos de Origem Animal","Vetesul"],["9h","Julgamento de Admissão da raça Angus - Nacional",""],["12h","Abertura parrilla El Indomable","Núcleo Sudeste de Angus"],["13h30","Ciranda Cultural Embrapa","Pavilhão Jorge Gertum"],["13h30","Encontro de Confinamento e Recriadores da Metade Sul do RS","Arena da Conferência"],["14h","Mostra UFPel","Pavilhão Jorge Gertum"],["14h","Admissão da Raça Charolês","Centro de Manejo"]],
 7:[["8h","1º Fórum de Irrigação da Metade Sul do RS","Arena da Conferência"],["8h","V Seminário Nutrirumen","AEAPEL"],["8h30","Julgamento de Classificação da Raça Angus - Nacional","Pista E"],["13h","Abertura da Agricultura Familiar","Pavilhão da Agricultura Familiar"],["13h30","Ciranda Cultural Embrapa","Pavilhão Jorge Gertum"],["13h30","PRODES em Debate: Monitoramento ambiental e os novos desafios no Agronegócio","Arena da Conferência"],["14h","Admissão da Raça Charolês","Centro de Manejo"],["14h","Mostra UFPel","Pavilhão Jorge Gertum"],["14h","Julgamento de Classificação da Raça Angus - Nacional","Pista E"],["14h","Julgamento de Admissão das raças Hereford e Braford","Centro de Manejo"]],
 8:[["8h","Entrada dos Animais da Raça Pônei","Pavilhão 8"],["8h","Julgamento de Admissão das raças Hereford e Braford","Centro de Manejo"],["8h","Seminário Fibra Repro+","AEAPEL"],["8h15","Floresta do Futuro","Casa da Amizade"],["9h","Juntos pelo Agro","Arena da Conferência"],["9h","Minha Vida, Minhas Escolhas: Carreiras e Propósitos","Pavilhão Jorge Gertum"],["9h","Seminário de Bovinos de Leite","Vetesul"],["12h30","Término da Entrada dos Animais das Raças Ovinas","Pavilhão 8"],["13h30","Julgamento de Classificação das raças Hereford e Braford - rústicos","Pista E"],["13h30","Ciranda Cultural Embrapa","Pavilhão Jorge Gertum"],["16h","Julgamento de Admissão do Concurso Leiteiro da Raça Jersey","Pista D"],["18h","Esgota do Concurso Leiteiro da Raça Jersey",""],["18h","Término da entrada da Raça Pônei","Pavilhão 8"],["18h","Folklore do Prata 01 (Fabiano Bacchieri, Rodrigo Jacques e Guilherme Collares)","Palco Tropa Entregue"],["19h","Crédito Rural: O Desafio do Produtor Gaúcho","Casa da Amizade"],["19h","Mérito Rural","Restaurante e Salão Nobre"],["19h","Projeto Taureando","Pavilhão Jorge Gertum"],["19h","Leilão Genética em Dose Dupla","Pavilhão Álvaro Azevedo"]],
 9:[["6h","Primeira Ordenha do Concurso Leiteiro da Raça Jersey",""],["8h","Julgamento de Admissão da Raça Holandês","Centro de Manejo"],["8h","Julgamento de Admissão raça Devon","Centro de Manejo"],["9h","Fórum de Aftosa","Arena da Conferência"],["9h","Novos Caminhos da Pecuária do Sul: Produção, Ambientes e Novos Mercados","AEAPEL"],["10h","Julgamento de Classificação de animais da raça Hereford Braford de argola","Centro de Manejo"],["12h","Término da entrada de animais da Raça Jersey","Centro de Manejo"],["13h","Julgamento de Admissão da Raça Pônei","Pista A"],["13h","Julgamento de Admissão da Raça Jersey","Centro de Manejo"],["13h30","Ciranda Cultural Embrapa","Pavilhão Jorge Gertum"],["14h","Mostra UFPel","Pavilhão Jorge Gertum"],["14h","Territórios, Conexões e Inovação","Arena da Conferência"],["14h","Comissão de Mulheres do Agro convida: Além dos limites, mulheres que lideram e transformam","Casa da Amizade"],["14h","Julgamento de Classificação raça Devon","Pista E"],["14h","Julgamento de Classificação da Raça Pônei","Pista A"],["14h","Julgamento de Admissão das Raças Ovinas","Centro de Manejo"],["14h","Arte na Rural","Salão Nobre"],["15h","Momento com a Jersey","Em frente ao Núcleo Jersey"],["16h","Conversas Foco Pecuária","Foco Pampeano"],["18h","Última Ordenha do Concurso Leiteiro da Raça Jersey",""],["18h","Término da entrada dos animais da raça Crioula","NSCCC"],["18h","Julgamento de Admissão da Raça Jersey","Centro de Manejo"],["18h","Folklore do Prata 02 (Fabiano Bacchieri, Rodrigo Jacques e Guilherme Collares)","Palco Tropa Entregue"],["18h","Mérito Agronômico","Casa da Amizade"],["19h","Remate Santa Eulália","Pavilhão Álvaro Azevedo"],["19h","Show internacional de Catherine Vergnes","Pavilhão Jorge Gertum"],["19h15","Grupo de Danzas Folklóricas Argentinas \"Jirón Gaucho\" e Grupo Música Folklórica Entre Amigos","Palco Tropa Entregue"],["20h","Jantar da Confraria do Vinho","Restaurante"]],
 10:[["8h","Concentração dos animais da raça Crioula","Pavilhão 7"],["8h","Julgamento de Admissão raça Brangus","Centro de Manejo"],["9h","Julgamento de Classificação das Raças Ovinas lã e mista","Pista D"],["9h","Julgamento de Admissão da Raça Pônei","Pista A"],["10h","Admissão dos animais da raça Crioula","Pavilhão 7"],["10h","Viva RS","Pavilhão Jorge Gertum"],["11h30","Cabanheiro do Futuro","Pista D"],["14h","Julgamento Morfológico dos animais da raça Crioula","Pista B"],["14h","Grandes campeonatos da Raça Pônei","Pista A"],["14h","Arte na Rural","Salão Nobre"]],
 11:[["7h","III Concurso de Assado Ovino e I Concurso de Costelão","Pista D"],["8h30","Julgamentos Morfológicos dos animais da raça Crioula","Pista A"],["9h","União Nativa ao Vivo (Alex Moreira e Matt Thofehrn), Tema Festivais, participação Os Andeiros","Palco Tropa Entregue"],["9h30","Provas Funcionais Raça Pônei","Pista B"],["10h","Viva RS","Pavilhão Jorge Gertum"],["10h","Julgamento de Classificação Animais Jovens da Raça Jersey","Pista D"],["10h30","Julgamento de Classificação da Raça Holandês","Galpão 6"],["12h","Entrega de Prêmios da Raça Holandês","Núcleo Holandês"],["14h","Demonstração de esquila","Galpão 8"]],
 12:[["8h","Julgamento de Classificação da raça Brangus - Argola","Pista E"],["10h","Demonstrativo de pastoreio de rebanho com cães Border Collie","Pista D"],["10h","Viva RS","Pavilhão Jorge Gertum"],["10h","Concurso Puxador Mirim da Raça Jersey","Pista D"],["12h","Entrega de Prêmios e Almoço de Confraternização da Raça Jersey","Núcleo Jersey"],["14h","Arte na Rural","Salão Nobre"],["14h","Demonstração de esquila Tally-Hi","Galpão de Ovinos 8"],["14h","Demonstrativo de pastoreio de rebanho com cães Border Collie","Pista D"],["15h","Desfile dos Campeões","Pistas A e B"]]
};

const mins=t=>{const[h,m]=t.split('h');return(+h)*60+(+m||0)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YEAR=2026, days=Object.keys(DATA).map(Number);
const today=new Date();
let cur=(today.getFullYear()===YEAR&&today.getMonth()===9&&days.includes(today.getDate()))?today.getDate():days[0];

const nav=document.getElementById('days');
nav.innerHTML=days.map(d=>{const w=WEEK[new Date(YEAR,9,d).getDay()].slice(0,3);return `<button class="day" role="tab" data-d="${d}">${String(d).padStart(2,'0')}/10<small>${w}</small></button>`}).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('.day');if(b){cur=+b.dataset.d;render()}});
document.getElementById('q').addEventListener('input',render);

function render(){
  nav.querySelectorAll('.day').forEach(b=>b.setAttribute('aria-selected',+b.dataset.d===cur));
  const q=document.getElementById('q').value.trim().toLowerCase();
  const wd=new Date(YEAR,9,cur).getDay();
  document.getElementById('pill').innerHTML=`<b>${String(cur).padStart(2,'0')} de outubro</b><span class="sep">|</span>${WEEK[wd]}`;
  const items=DATA[cur].map((e,i)=>({t:e[0],n:e[1],l:e[2],i}))
    .sort((a,b)=>mins(a.t)-mins(b.t)||a.i-b.i)
    .filter(e=>!q||(e.n+' '+e.l).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=items.length?items.map(e=>`
    <li class="card">
      <div class="time">${e.t}</div><div class="bar"></div>
      <div><h3>${esc(e.n)}${CONF.includes(e.l)?'<span class="tag">Conferência</span>':''}</h3>
      ${e.l?`<div class="loc">${PIN}${esc(e.l)}</div>`:''}</div>
    </li>`).join(''):'<li class="empty">Nenhum evento encontrado neste dia.</li>';
}
render();
nav.querySelector(`[data-d="${cur}"]`).scrollIntoView({inline:'center',block:'nearest'});
</script>
</body>
</html>
